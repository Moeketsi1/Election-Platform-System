<!DOCTYPE html>
<html>
    <head>
        <title>Election Platform - Authentication</title>
        
        <!-- Import Firebase using modules -->
        <script type="module">
            import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
            import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

            const firebaseConfig = {
                apiKey: "AIzaSyArMcYsmynZj9ZTU-bVrS1Cd0sY-uTJ_q4",
                authDomain: "election-platform-2bd6e.firebaseapp.com",
                projectId: "election-platform-2bd6e",
                storageBucket: "election-platform-2bd6e.firebasestorage.app",
                messagingSenderId: "217515421593",
                appId: "1:217515421593:web:ccc375f261a9f1b3846d08"
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            window.login = async function() {
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    // const idToken = await userCredential.user.getIdToken();

                    // Wait a second before getting token
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    const idToken = await userCredential.user.getIdToken(true); // Force refresh

                    // Store token in localStorage
                    localStorage.setItem('userToken', idToken);

                    // Send token to Flask server
                    const response = await fetch('/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ id_token: idToken }),
                    });

                    const result = await response.json();
                    if (response.ok) {
                        window.location.href = '/vote'; // Redirect to voting page
                    } else {
                        alert(result.error || 'Login failed');
                    }
                } catch (error) {
                    alert('Error during login: ' + error.message);
                }
            }
        </script>

        <style>
            .auth-section {
                margin: 20px auto;
                max-width: 500px;
                text-align: center;
                padding: 20px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
                border-radius: 8px;
                font-family: monospace;
                font-size: 20px;
            }

            .auth-section input {
                display: block;
                margin: 10px auto;
                padding: 10px;
                width: 80%;
                border: 1px solid #ddd;
                border-radius: 4px;
            }

            .auth-section button {
                margin-top: 10px;
                padding: 10px 20px;
                cursor: pointer;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 5px;
            }

            .auth-section button:hover {
                background-color: #45a049;
            }
        </style>
    </head>
    <body>
        <div class="auth-section">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>
    </body>
</html>
