<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Election Platform - Registration</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Import Firebase Configuration -->
        <script type="module">
            import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
            import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
            import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

            const firebaseConfig = {
                apiKey: "",
                authDomain: "",
                projectId: "",
                storageBucket: "",
                messagingSenderId: "",
                appId: ""
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // Signup function
            window.signup = async function () {
                const name = document.getElementById("signup-name").value.trim();
                const surname = document.getElementById("signup-surname").value.trim();
                const cellphone = document.getElementById("signup-cellphone").value.trim();
                const email = document.getElementById("signup-email").value.trim();
                const password = document.getElementById("signup-password").value.trim();
                const province = document.getElementById("signup-province").value;
                const messageElement = document.getElementById("message");

                // Validate inputs
                if (!name || !surname || !cellphone || !email || !password || !province) {
                    messageElement.textContent = "Please fill out all fields.";
                    messageElement.style.color = "red";
                    return;
                }

                try {
                    // Create user in Firebase Authentication
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Send email verification
                    await sendEmailVerification(user);

                    // Store user details in Firestore
                    await setDoc(doc(db, "users", user.uid), {
                        name,
                        surname,
                        cellphone,
                        email,
                        province,
                        voted: false, // Default value for vote status
                        createdAt: new Date().toISOString()
                    });


                    // Display success message
                    messageElement.textContent = "Registration successful! Please verify your email.";
                    messageElement.style.color = "green";

                    // Optionally, redirect to login page
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 3000);
                } catch (error) {
                    console.error("Error during registration:", error);

                    // Display error message
                    messageElement.textContent = `Error: ${error.message}`;
                    messageElement.style.color = "red";
                }
            }
        </script>
    </head>
    <style>
        .auth-section {
            margin: 20px auto;
            max-width: 500px;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
        }

        .auth-section input,
        .auth-section select {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 80%;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .auth-section button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .auth-section button:hover {
            background-color: #45a049;
        }

        #message {
            color: red;
            margin-top: 10px;
        }
    </style>
    <body>
        <div class="auth-section">
            <h1>Register</h1>
            <input type="text" id="signup-name" placeholder="First Name">
            <input type="text" id="signup-surname" placeholder="Last Name">
            <input type="tel" id="signup-cellphone" placeholder="Cellphone Number">
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
            <label for="signup-province">Province:</label>
            <select id="signup-province" id="signup-province">
                <option value="" disabled selected>Select your province</option>
                <option value="eastern-cape">Eastern Cape</option>
                <option value="free-state">Free State</option>
                <option value="gauteng">Gauteng</option>
                <option value="kwazulu-natal">KwaZulu-Natal</option>
                <option value="limpopo">Limpopo</option>
                <option value="mpumalanga">Mpumalanga</option>
                <option value="northern-cape">Northern Cape</option>
                <option value="north-west">North West</option>
                <option value="western-cape">Western Cape</option>
            </select>
            <button onclick="signup()">Sign Up</button>
            <p id="message"></p>
        </div>
    </body>
</html>
