<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title id="img11">Election Results</title>
        
        <script type="module" src="{{ url_for('static', filename='./js/firebase-config.js') }}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
        
        <style>
            .results-container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
                font-family: monospace;
                font-size: 15px;
            }
            .chart-container {
                margin: 20px 0;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 8px;
                height: 400px;
            }
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin: 20px 0;
            }
            .stat-card {
                background-color: #f5f5f5;
                padding: 15px;
                border-radius: 8px;
                text-align: center;
            }
            .nav-links {
                margin: 20px 0;
                text-align: center;
            }
            .nav-links a {
                margin: 0 10px;
                padding: 8px 16px;
                text-decoration: none;
                color: white;
                background-color: #4CAF50;
                border-radius: 4px;
            }
            
        </style>
    </head>
    <body>
        <div class="results-container">
            <h1>Election Results</h1>

            <div class="nav-links">
                <a href="/register">Register</a>
                <a href="/login">Login</a>
                <a href="/vote">Vote</a>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Votes Cast</h3>
                    <p id="total-votes">0</p>
                </div>
                <div class="stat-card">
                    <h3>Future First Coalition</h3>
                    <p id="green-votes">0 (0%)</p>
                </div>
                <div class="stat-card">
                    <h3>Economic Renewal Party</h3>
                    <p id="local-votes">0 (0%)</p>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="pieChart"></canvas>
            </div>

            <div class="chart-container">
                <canvas id="lineChart"></canvas>
            </div>
 
        </div>
        </div>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        

            const firebaseConfig = {
              apiKey: "",
              authDomain: "",
              projectId: "",
              storageBucket: "",
              messagingSenderId: "",
              appId: ""
            };
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            let pieChart, lineChart;
            
            function initializeCharts() {
                const pieCtx = document.getElementById('pieChart').getContext('2d');
                const lineCtx = document.getElementById('lineChart').getContext('2d');

                pieChart = new Chart(pieCtx, {
                    type: 'pie',
                    data: {
                        labels: ['Future First Coalition', 'Economic Renewal Party'],
                        datasets: [{
                            data: [0, 0],
                            backgroundColor: ['rgb(34, 139, 34)', 'rgb(54, 162, 235)']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });

                lineChart = new Chart(lineCtx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            {
                                label: 'Future First Coalition',
                                borderColor: 'rgb(34, 139, 34)',
                                data: []
                            },
                            {
                                label: 'Economic Renewal Party',
                                borderColor: 'rgb(54, 162, 235)',
                                data: []
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }

            function updateStats(data) {
                const totalVotes = data.total_votes || 0;
                const candidate1Votes = data.candidate_1_votes || 0;
                const candidate2Votes = data.candidate_2_votes || 0;

                document.getElementById('total-votes').textContent = totalVotes;
                document.getElementById('green-votes').textContent = 
                    `${candidate1Votes} (${((candidate1Votes/totalVotes)*100 || 0).toFixed(1)}%)`;
                document.getElementById('local-votes').textContent = 
                    `${candidate2Votes} (${((candidate2Votes/totalVotes)*100 || 0).toFixed(1)}%)`;

                // Update pie chart
                pieChart.data.datasets[0].data = [candidate1Votes, candidate2Votes];
                pieChart.update();

                // Update line chart
                const timestamp = new Date().toLocaleTimeString();
                addDataPoint(timestamp, candidate1Votes, candidate2Votes);
            }

            function addDataPoint(label, value1, value2) {
                lineChart.data.labels.push(label);
                lineChart.data.datasets[0].data.push(value1);
                lineChart.data.datasets[1].data.push(value2);

                if (lineChart.data.labels.length > 10) {
                    lineChart.data.labels.shift();
                    lineChart.data.datasets.forEach(dataset => dataset.data.shift());
                }

                lineChart.update();
            }

            // Initialize everything when the page loads
            document.addEventListener('DOMContentLoaded', () => {
                initializeCharts();
                
                // Set up real-time listener
                const statsRef = doc(db, 'statistics', 'vote_counts');
                onSnapshot(statsRef, (doc) => {
                    if (doc.exists()) {
                        updateStats(doc.data());
                    }
                });
            });
        </script>
    </body>
</html>
